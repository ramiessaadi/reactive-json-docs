                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Another action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Something else here"
                    - type: li
                      content:
                        - type: hr
                          attributes:
                            class: "dropdown-divider"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Separated link"

        sizingTemplate:
          type: div
          attributes:
            class: "col-md-6 mb-3"
          content:
            - type: div
              attributes:
                class: "btn-group"
              content:
                - type: button
                  attributes:
                    class: "btn btn-secondary ~.size dropdown-toggle"
                    type: "button"
                    data-bs-toggle: "dropdown"
                    aria-expanded: "false"
                  content: ~.label
                - type: ul
                  attributes:
                    class: "dropdown-menu"
                  content:
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Another action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Something else here"
                    - type: li
                      content:
                        - type: hr
                          attributes:
                            class: "dropdown-divider"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Separated link"

        directionTemplate:
          type: div
          attributes:
            class: "col-md-3 mb-3"
          content:
            - type: div
              attributes:
                class: "~.direction"
              content:
                - type: button
                  attributes:
                    class: "btn btn-secondary dropdown-toggle"
                    type: "button"
                    data-bs-toggle: "dropdown"

                - type: ul
                  attributes:
                    class: "dropdown-menu"
                  content:
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"

                          content: "Another action"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"
                          content: "Something else here"
                    - type: li
                      content:
                        - type: hr
                          attributes:
                            class: "dropdown-divider"
                    - type: li
                      content:
                        - type: a
                          attributes:
                            class: "dropdown-item"
                            href: "#"

                        aria-labelledby: "list-profile-list"
                      content: "Cupidatat quis ad sint excepteur laborum in esse qui. Et excepteur consectetur ex nisi eu do cillum ad laborum. Mollit et eu officia dolore sunt Lorem culpa qui commodo velit ex veniam culpa."
                    - type: div
                      attributes:
                        class: "tab-pane fade"

renderView:
  - type: h2
    content: "Modal Variants Bootstrap"
  
  # Vue d'ensemble
  - type: h3
    content: "Vue d'ensemble"
  - type: p
    content: "Documentation et exemples pour utiliser les différentes variantes de modals Bootstrap."
  
  # Modal Large
  - type: h3
    content: "Modal Large"
  - type: p
    content: "Utilisez .modal-lg pour créer un modal plus large."
  
  - type: button
    attributes:
      type: "button"
      class: "btn btn-primary"
      data-bs-toggle: "modal"
      data-bs-target: "#modalLarge"
    content: "Ouvrir le modal large"
  
  - type: div
    attributes:
      class: "modal fade"
      id: "modalLarge"
      tabindex: "-1"
      aria-labelledby: "modalLargeLabel"
      aria-hidden: "true"
    content:
      - type: div
        attributes:
          class: "modal-dialog modal-lg"
        content:
          - type: div
            attributes:
              class: "modal-content"
            content:
              - type: div
                attributes:
                  class: "modal-header"
                content:
                  - type: h5
                    attributes:
                      class: "modal-title"
                      id: "modalLargeLabel"
                    content: "Modal Large"
                  - type: button
                    attributes:
                      type: "button"
                      class: "btn-close"
                      data-bs-dismiss: "modal"
                      aria-label: "Close"
              - type: div
                attributes:
                  class: "modal-body"
                content: "Ceci est un modal large (modal-lg)."
              - type: div
                attributes:
                  class: "modal-footer"
                content:
                  - type: button
                    attributes:
                      type: "button"
                      class: "btn btn-secondary"
                      data-bs-dismiss: "modal"
                    content: "Fermer"
                  - type: button
                    attributes:
                      type: "button"
                      class: "btn btn-primary"
                    content: "Sauvegarder"
  
  # Modal Extra Large
  - type: h3
    content: "Modal Extra Large"
  - type: p
    content: "Utilisez .modal-xl pour créer un modal extra large."
  
  - type: button
    attributes:
      type: "button"
      class: "btn btn-primary"
      data-bs-toggle: "modal"
      data-bs-target: "#modalXl"
    content: "Ouvrir le modal extra large"
  
  - type: div
    attributes:
      class: "modal fade"
      id: "modalXl"
      tabindex: "-1"
      aria-labelledby: "modalXlLabel"
      aria-hidden: "true"
    content:
      - type: div
        attributes:

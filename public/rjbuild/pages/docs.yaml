renderView:
  # Bootstrap CSS
  - type: link
    attributes:
      rel: "stylesheet"
      href: "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  
  # Bootstrap JavaScript
  - type: script
    attributes:
      src: "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  
  - type: div
    attributes:
      class: d-xl-flex
    content:
      - type: Sidebar

      - type: div
        attributes:
          class: container-md
        content:

          - type: div
            attributes:
              class: mt-4
            content:
              type: ReactiveJsonSubroot
              rjOptions:
                rjBuildUrl: /rjbuild/component/message.yaml

          - type: DemoContentMapper

templates:

data:
